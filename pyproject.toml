[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dubai-realty-bot"
version = "0.1.0"
description = "Private Telegram bot for Dubai real estate lookups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "structlog>=24.0",
    "tenacity>=9.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]
madmoun = [
    "playwright>=1.49",
]

[project.scripts]
dubai-realty-bot = "bot.main:run"
realty-cli = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "src/config", "src/db", "src/importers", "src/scrapers", "src/services"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli.py" = "cli.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true