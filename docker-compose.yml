services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realty
      POSTGRES_PASSWORD: realty
      POSTGRES_DB: realty
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty -d realty"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://realty:realty@postgres:5432/realty
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]

volumes:
  pgdata: